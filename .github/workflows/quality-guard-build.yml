name: Quality Guard Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build"
        required: true
        default: "egress-enhancements"
        type: string

permissions:
  contents: read

concurrency:
  group: quality-guard-build-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Verify and build linux amd64
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Test backend
        working-directory: backend
        run: go test ./...

      - name: Vet backend
        working-directory: backend
        run: go vet ./...

      - name: Test quality guard
        run: python3 -m unittest tools/egress-quality-guard/quality_guard_test.py

      - name: Build linux amd64 binary
        working-directory: backend
        run: |
          mkdir -p ../artifacts
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -buildvcs=false -trimpath \
            -ldflags='-s -w' -o ../artifacts/grok2api-linux-amd64 ./cmd/grok2api

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: grok2api-linux-amd64-${{ github.run_id }}
          path: artifacts/grok2api-linux-amd64
          if-no-files-found: error
          retention-days: 14

      - name: Build amd64 container image archive
        uses: docker/setup-buildx-action@v3

      - name: Export amd64 container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          outputs: type=oci,dest=/tmp/grok2api-linux-amd64.tar
          provenance: false
          sbom: false

      - name: Upload container image artifact
        uses: actions/upload-artifact@v4
        with:
          name: grok2api-image-linux-amd64-${{ github.run_id }}
          path: /tmp/grok2api-linux-amd64.tar
          if-no-files-found: error
          retention-days: 14
