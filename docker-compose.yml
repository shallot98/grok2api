name: grok2api

services:
  grok2api:
    container_name: grok2api
    image: "${GROK2API_IMAGE:-ghcr.io/chenyme/grok2api:latest}"
    ports:
      # 仅本机 nginx 反代；勿对公网暴露，否则 trustedLogin 网关 IP 会被滥用
      - "127.0.0.1:${GROK2API_PORT:-8000}:8000"
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      # 非空时覆盖 config.yaml 的 PostgreSQL DSN，并自动启用 postgres。
      GROK2API_DATABASE_URL: "${GROK2API_DATABASE_URL:-}"
      GROK2API_QUALITY_GUARD_DIR: /var/lib/grok2api-quality-guard
    volumes:
      - "${GROK2API_CONFIG:-./config.yaml}:/run/grok2api/config.yaml:ro"
      - grok2api-data:/app/data
      - quality_guard_state:/var/lib/grok2api-quality-guard
    networks:
      default:
        ipv4_address: 172.22.0.2
      resin_default:
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

  # ================================ EGRESS QUALITY GUARD ================================
  # 可选的 Grok Build 出口质量守护 sidecar。默认不启动，也不会产生探测请求。
  # 启用前在 config.yaml 中配置 qualityGuard，然后执行：
  # docker compose --profile quality-guard up -d --no-build

  egress-quality-guard:
    container_name: grok2api-egress-quality-guard
    profiles: ["quality-guard"]
    environment:
      QG_ACTIVE_CONCURRENCY: "1"
      QG_MAX_ROTATION_ATTEMPTS: "3"
    build:
      context: .
      dockerfile: tools/egress-quality-guard/Dockerfile
    depends_on:
      grok2api:
        condition: service_healthy
    volumes:
      - quality_guard_state:/var/lib/grok2api-quality-guard
      - ./tools/egress-quality-guard/quality_guard.py:/usr/local/bin/grok2api-egress-quality-guard:ro
    restart: "on-failure:5"
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

  # 如需 FlareSolverr：docker compose --profile flaresolverr up -d
  # 管理端 Clearance 模式设为 FlareSolverr，地址 http://flaresolverr:8191
  flaresolverr:
    container_name: flaresolverr
    image: ghcr.io/flaresolverr/flaresolverr:latest
    profiles: ["flaresolverr"]
    environment:
      TZ: Asia/Shanghai
      LOG_LEVEL: info
    restart: unless-stopped

volumes:
  grok2api-data:
  quality_guard_state:

networks:
  default:
    name: grok2api_default
    external: true
  resin_default:
    external: true
